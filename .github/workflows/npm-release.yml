name: Burnt npm Published Release

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@992944a4d890e517aa314204e5dceb49a42555c3 # v1.6.0

  metadata:
    needs: quality
    if: inputs.prerelease == false
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        # The prefix check is a namespace guard, same as cloudflare-release's:
        # in a repository with more than one release flow, this workflow
        # receives `release` events for every flow's tags, and publishing a
        # package because a Worker release was cut is exactly the confusion
        # the prefix exists to prevent. A tag outside this flow's namespace is
        # an error, not a skip — the caller is expected to filter, so reaching
        # here with a foreign tag means the routing is wrong.
        env:
          RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.npm-policy).releasePrefix }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          tag_prefix=""
          if [ -n "$RELEASE_PREFIX" ]; then tag_prefix="${RELEASE_PREFIX}-"; fi
          VERSION="${RELEASE_TAG#"$tag_prefix"v}"
          if [ "$RELEASE_TAG" = "$VERSION" ] ||
             ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag $RELEASE_TAG does not belong to ${RELEASE_PREFIX:-the default release namespace} or is not strict ${tag_prefix}vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: [quality, metadata]
    if: fromJSON(needs.quality.outputs.npm-policy).promotionMode == 'manual'
    permissions:
      contents: read
      id-token: write
    uses: burnt-labs/github-workflows/.github/workflows/npm-publish.yml@992944a4d890e517aa314204e5dceb49a42555c3 # v1.6.0
    with:
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      npm-policy: ${{ needs.quality.outputs.npm-policy }}
      version: ${{ needs.metadata.outputs.version }}
      dist-tag: ${{ fromJSON(needs.quality.outputs.npm-policy).releaseDistTag }}

  annotate-release:
    needs: publish-release
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          PACKAGE_NAME: ${{ needs.publish-release.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.publish-release.outputs.package-version }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "## npm release"
            echo
            echo "- Package: \`$PACKAGE_NAME@$PACKAGE_VERSION\`"
            echo "- npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file "$RUNNER_TEMP/body.md"
