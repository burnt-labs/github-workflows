name: Burnt npm Published Release

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@0edf0e43d8657f05fa08591a69f5a2d38a7f0dd3 # v1.3.4

  metadata:
    needs: quality
    if: inputs.prerelease == false
    runs-on: ubicloud-standard-2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.npm-policy).releasePrefix }}
        run: |
          VERSION="$RELEASE_TAG"
          # A prefixed repository publishes only its own releases. Refusing a
          # tag from another line is the point: in a repository that also
          # deploys a Worker, publishing the release the Worker just cut would
          # push an unrelated version to npm.
          if [ -n "$RELEASE_PREFIX" ]; then
            case "$VERSION" in
              "$RELEASE_PREFIX"-v*) VERSION="${VERSION#"$RELEASE_PREFIX"-}" ;;
              *)
                echo "::notice::$RELEASE_TAG is not a $RELEASE_PREFIX- release; nothing to publish."
                echo "version=" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be strict ${RELEASE_PREFIX:+$RELEASE_PREFIX-}vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: [quality, metadata]
    # An empty version means the release belongs to another tag line in this
    # repository — the Worker's, typically — and is not ours to publish.
    if: >-
      needs.metadata.outputs.version != '' &&
      fromJSON(needs.quality.outputs.npm-policy).promotionMode == 'manual'
    permissions:
      contents: read
      id-token: write
    uses: burnt-labs/github-workflows/.github/workflows/npm-publish.yml@0edf0e43d8657f05fa08591a69f5a2d38a7f0dd3 # v1.3.4
    with:
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      npm-policy: ${{ needs.quality.outputs.npm-policy }}
      version: ${{ needs.metadata.outputs.version }}
      dist-tag: ${{ fromJSON(needs.quality.outputs.npm-policy).releaseDistTag }}

  annotate-release:
    needs: publish-release
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          PACKAGE_NAME: ${{ needs.publish-release.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.publish-release.outputs.package-version }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "## npm release"
            echo
            echo "- Package: \`$PACKAGE_NAME@$PACKAGE_VERSION\`"
            echo "- npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file "$RUNNER_TEMP/body.md"
