name: Burnt npm Publish

on:
  workflow_call:
    inputs:
      quality-policy:
        required: true
        type: string
      npm-policy:
        required: true
        type: string
      version:
        required: true
        type: string
      dist-tag:
        required: true
        type: string
    outputs:
      package-name:
        value: ${{ jobs.publish.outputs.package-name }}
      package-version:
        value: ${{ jobs.publish.outputs.package-version }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.dist-tag }}
    runs-on: ubicloud-standard-4
    outputs:
      package-name: ${{ steps.package.outputs.name }}
      package-version: ${{ inputs.version }}
    defaults:
      run:
        working-directory: ${{ fromJSON(inputs.quality-policy).workingDirectory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Pin the npm CLI
        # See "npm install-time security" in AGENTS.md. npm 12 is the floor for
        # both halves of this flow: it enforces the install-time defaults, and
        # it is well past the 11.5.1 that trusted publishing needs.
        run: |
          npm install --global npm@12
          if [ "$(npm --version | cut -d. -f1)" != "12" ]; then
            echo "::error::Expected npm 12 on PATH, found $(npm --version). Something is shadowing the pinned CLI."
            exit 1
          fi
      - name: Verify trusted publishing credentials
        # A caller that forgets `id-token: write` fails much later, inside
        # `npm publish`, as an authentication error that reads like a registry
        # problem. Say so here instead. The token check is the other half of the
        # same contract: npm is retiring 2FA-bypass granular access tokens, so a
        # token reaching this job is a credential that should not exist rather
        # than a fallback worth taking.
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available. The calling workflow must grant id-token: write."
            exit 1
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ]; then
            echo "::error::An npm token is present. This flow publishes with trusted publishing and must not carry one."
            exit 1
          fi
      - name: Install
        run: ${{ fromJSON(inputs.quality-policy).commands.install }}
      # The package-scoped steps below override the job default (the quality
      # policy's workingDirectory) with the npm policy's, the same directory
      # npm-pr.yml and npm-main.yml already run in. The two differ in a
      # workspace repository — quality commands run at the root, where the
      # lockfile lives, while the publishable package sits in a subdirectory —
      # and `npm publish` from the root would pack the root package instead.
      # A package that needs compiling before it packs declares that itself,
      # in `prepublishOnly`, which `npm publish` runs from the package
      # directory with the root install already in place.
      - name: Set publish version without committing
        working-directory: ${{ fromJSON(inputs.npm-policy).workingDirectory }}
        env:
          VERSION: ${{ inputs.version }}
          VERSION_FILE: ${{ fromJSON(inputs.npm-policy).versionFile }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const file = process.env.VERSION_FILE;
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          pkg.version = process.env.VERSION;
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
      - name: Build
        run: ${{ fromJSON(inputs.quality-policy).commands.build }}
      - name: Read package name
        id: package
        working-directory: ${{ fromJSON(inputs.npm-policy).workingDirectory }}
        env:
          VERSION_FILE: ${{ fromJSON(inputs.npm-policy).versionFile }}
        run: echo "name=$(node -p "require('./' + process.env.VERSION_FILE).name")" >> "$GITHUB_OUTPUT"
      - name: Check immutable version
        id: existing
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          if npm view "$PACKAGE_NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with provenance when the source is public
        if: steps.existing.outputs.exists == 'false'
        working-directory: ${{ fromJSON(inputs.npm-policy).workingDirectory }}
        # The registry only accepts provenance from public source repositories
        # — a private repository's publish is refused outright with E422, not
        # published without the attestation. Provenance is therefore gated on
        # visibility rather than requested unconditionally: a private
        # repository publishes via the same OIDC trusted publishing, just
        # without the attestation, and starts attesting the moment it goes
        # public with no workflow change.
        #
        # The fragment keeps `--provenance` on the && side and '' on the ||
        # side. The idiom returns the last evaluated operand and '' is falsy,
        # so the reversed form — condition && '' || flag — would emit the flag
        # every time (see the same trap documented in cloudflare-version.yml).
        run: >-
          npm publish
          --access ${{ fromJSON(inputs.npm-policy).access }}
          --tag ${{ inputs.dist-tag }}
          ${{ github.event.repository.private == false && '--provenance' || '' }}
      - name: Report package
        run: |
          {
            echo "### npm publication"
            echo "- Package: \`${{ steps.package.outputs.name }}@${{ inputs.version }}\`"
            echo "- Dist-tag: \`${{ inputs.dist-tag }}\`"
            echo "- Already existed: \`${{ steps.existing.outputs.exists }}\`"
            echo "- Provenance: \`${{ github.event.repository.private == false }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
