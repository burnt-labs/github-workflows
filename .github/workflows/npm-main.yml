name: Burnt npm Main Promotion

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@8373e9454803608c670431a67bd416178c633144 # v1.5.0

  metadata:
    needs: quality
    runs-on: ubicloud-standard-2
    defaults:
      run:
        working-directory: ${{ fromJSON(needs.quality.outputs.npm-policy).workingDirectory }}
    outputs:
      candidate-tag: ${{ steps.metadata.outputs.candidate-tag }}
      candidate-version: ${{ steps.versions.outputs.candidate-version }}
      release-tag: ${{ steps.metadata.outputs.release-tag }}
      release-version: ${{ steps.versions.outputs.release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `conventional` reads the commits since the last release tag, which
          # needs history and the tags themselves. Shallow by default, so this
          # is explicit; `patch` does not read commits and does not care.
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnt-labs/github-workflows
          ref: 8373e9454803608c670431a67bd416178c633144 # v1.5.0
          path: .burnt-workflows
      - name: Read stable release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$RUNNER_TEMP/release-tags.txt"
      - name: Read commits since the last release
        env:
          RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.npm-policy).releasePrefix }}
          VERSION_STRATEGY: ${{ fromJSON(needs.quality.outputs.npm-policy).versionStrategy }}
        run: |
          : > "$RUNNER_TEMP/commit-messages.txt"
          if [ "$VERSION_STRATEGY" != "conventional" ]; then
            exit 0
          fi
          # The newest stable tag IN THIS FLOW'S NAMESPACE that exists in this
          # clone. Filtering by prefix matters in a repository with more than
          # one release flow: without it, the newest stable release is whatever
          # another flow cut last — a Worker deploy, say — and the commit range
          # read here would start there instead of at the package's own last
          # release. A tag named by a release but never pushed as a git ref
          # would otherwise make `git log` fail; fall back to the whole
          # history, which is correct for a first release and merely verbose
          # afterwards.
          tag_prefix=""
          if [ -n "$RELEASE_PREFIX" ]; then tag_prefix="${RELEASE_PREFIX}-"; fi
          last=""
          while read -r tag; do
            [ -n "$tag" ] || continue
            # The prefix is a validated lowercase slug, so interpolating it
            # into the pattern cannot change the pattern's shape.
            if [[ ! "$tag" =~ ^${tag_prefix}v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              continue
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              last="$tag"
              break
            fi
          done < "$RUNNER_TEMP/release-tags.txt"
          if [ -n "$last" ]; then
            git log --format=%B%x00 "$last..HEAD" > "$RUNNER_TEMP/commit-messages.txt"
          else
            git log --format=%B%x00 > "$RUNNER_TEMP/commit-messages.txt"
          fi
      - id: metadata
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.npm-policy).releasePrefix }}
          VERSION_FILE: ${{ fromJSON(needs.quality.outputs.npm-policy).versionFile }}
          VERSION_STRATEGY: ${{ fromJSON(needs.quality.outputs.npm-policy).versionStrategy }}
          COMMIT_MESSAGES_FILE: ${{ runner.temp }}/commit-messages.txt
        run: |
          RELEASE_TAGS="$(cat "$RUNNER_TEMP/release-tags.txt")" \
            node "$GITHUB_WORKSPACE/.burnt-workflows/scripts/release-metadata.mjs"
      - id: versions
        # The tag carries the namespace; the npm version must not. Stripping
        # only `v` would hand npm `types-v1.2.3-rc.4` as a version, which it
        # rejects — so the configured prefix comes off with it.
        env:
          CANDIDATE_TAG: ${{ steps.metadata.outputs.candidate-tag }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release-tag }}
          RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.npm-policy).releasePrefix }}
        run: |
          tag_prefix=""
          if [ -n "$RELEASE_PREFIX" ]; then tag_prefix="${RELEASE_PREFIX}-"; fi
          echo "candidate-version=${CANDIDATE_TAG#"$tag_prefix"v}" >> "$GITHUB_OUTPUT"
          echo "release-version=${RELEASE_TAG#"$tag_prefix"v}" >> "$GITHUB_OUTPUT"

  publish-candidate:
    needs: [quality, metadata]
    permissions:
      contents: read
      id-token: write
    uses: burnt-labs/github-workflows/.github/workflows/npm-publish.yml@8373e9454803608c670431a67bd416178c633144 # v1.5.0
    with:
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      npm-policy: ${{ needs.quality.outputs.npm-policy }}
      version: ${{ needs.metadata.outputs.candidate-version }}
      dist-tag: ${{ fromJSON(needs.quality.outputs.npm-policy).candidateDistTag }}

  create-releases:
    needs: [quality, metadata, publish-candidate]
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.metadata.outputs.candidate-tag }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release-tag }}
          PACKAGE_NAME: ${{ needs.publish-candidate.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.publish-candidate.outputs.package-version }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## npm release candidate

          - Package: \`$PACKAGE_NAME@$PACKAGE_VERSION\`
          - npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION
          - Commit: \`${{ github.sha }}\`
          EOF
          if gh release view "$CANDIDATE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$CANDIDATE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$CANDIDATE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$CANDIDATE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "$CANDIDATE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi

  publish-release-automatic:
    needs: [quality, metadata, create-releases]
    if: >-
      !cancelled() &&
      needs.create-releases.result == 'success' &&
      fromJSON(needs.quality.outputs.npm-policy).promotionMode == 'automatic'
    permissions:
      contents: read
      id-token: write
    uses: burnt-labs/github-workflows/.github/workflows/npm-publish.yml@8373e9454803608c670431a67bd416178c633144 # v1.5.0
    with:
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      npm-policy: ${{ needs.quality.outputs.npm-policy }}
      version: ${{ needs.metadata.outputs.release-version }}
      dist-tag: ${{ fromJSON(needs.quality.outputs.npm-policy).releaseDistTag }}

  publish-github-release:
    needs: [metadata, publish-release-automatic]
    if: >-
      !cancelled() &&
      needs.publish-release-automatic.result == 'success'
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release-tag }}
          PACKAGE_NAME: ${{ needs.publish-release-automatic.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.publish-release-automatic.outputs.package-version }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "## npm release"
            echo
            echo "- Package: \`$PACKAGE_NAME@$PACKAGE_VERSION\`"
            echo "- npm: https://www.npmjs.com/package/$PACKAGE_NAME/v/$PACKAGE_VERSION"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --notes-file "$RUNNER_TEMP/body.md"
