name: Burnt Cloudflare PR

on:
  workflow_call:
    inputs:
      quality-policy-path:
        description: Repository-relative quality policy JSONC path
        required: false
        default: .github/quality-policy.jsonc
        type: string
      deployment-policy-path:
        description: Repository-relative deployment policy JSONC path
        required: false
        default: .github/deployment-policy.jsonc
        type: string
    secrets:
      # Optional so a caller can use `secrets: inherit` instead, which is what
      # publishing Worker secrets requires. cloudflare-version.yml resolves
      # either form and fails loudly if neither is present.
      cloudflare-account-id:
        required: false
      cloudflare-api-token:
        required: false

permissions:
  contents: read

jobs:
  quality:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@097d5108730cb869d1b83db72bef5949a16f8037 # v1.3.4
    with:
      quality-policy-path: ${{ inputs.quality-policy-path }}
      deployment-policy-path: ${{ inputs.deployment-policy-path }}
      deployment-required: true

  metadata:
    needs: quality
    runs-on: ubicloud-standard-2
    outputs:
      version-tag: ${{ steps.tag.outputs.version-tag }}
    steps:
      - id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.deployment-policy).releasePrefix }}
        run: |
          if [ -n "$RELEASE_PREFIX" ]; then RELEASE_PREFIX="${RELEASE_PREFIX}-"; fi
          echo "version-tag=${RELEASE_PREFIX}pr-${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  preview-candidate:
    needs: [quality, metadata]
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@097d5108730cb869d1b83db72bef5949a16f8037 # v1.3.4
    with:
      operation: preview
      target: candidate
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ needs.metadata.outputs.version-tag }}
      version-message: PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.html_url }}
    secrets: inherit

  publish-preview:
    needs: [quality, preview-candidate]
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ needs.preview-candidate.outputs.deployment-url }}
          RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.deployment-policy).releasePrefix }}
          VERSION_ID: ${{ needs.preview-candidate.outputs.version-id }}
        with:
          script: |
            const scope = process.env.RELEASE_PREFIX
            const marker = scope
              ? `<!-- burnt-cloudflare-candidate:${scope} -->`
              : `<!-- burnt-cloudflare-candidate -->`
            const heading = scope ? `${scope} candidate preview` : `Candidate preview`
            const body = [
              marker,
              `### ${heading}`,
              `- Preview: ${process.env.PREVIEW_URL}`,
              `- Cloudflare version: \`${process.env.VERSION_ID}\``,
              `- Commit: \`${context.sha}\``,
            ].join('\n')
            await core.summary.addRaw(body).write()
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const previous = comments.find((comment) => comment.body?.includes(marker))
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
