name: Burnt Cloudflare PR

on:
  workflow_call:
    secrets:
      cloudflare-account-id:
        required: true
      cloudflare-api-token:
        required: true

permissions:
  contents: read

jobs:
  quality:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.fork == false)
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@eff35146e19c05447efb38f0cc68e9587a7331c0

  metadata:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version-tag: ${{ steps.tag.outputs.version-tag }}
    steps:
      - id: tag
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
        run: echo "version-tag=pr-${PR_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  preview-candidate:
    needs: [quality, metadata]
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@eff35146e19c05447efb38f0cc68e9587a7331c0
    with:
      operation: preview
      target: candidate
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ needs.metadata.outputs.version-tag }}
      version-message: PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.html_url }}
    secrets:
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}

  publish-preview:
    needs: preview-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ needs.preview-candidate.outputs.deployment-url }}
          VERSION_ID: ${{ needs.preview-candidate.outputs.version-id }}
        with:
          script: |
            const marker = `<!-- burnt-cloudflare-candidate -->`
            const body = [
              marker,
              `### Candidate preview`,
              `- Preview: ${process.env.PREVIEW_URL}`,
              `- Cloudflare version: \`${process.env.VERSION_ID}\``,
              `- Commit: \`${context.sha}\``,
            ].join('\n')
            await core.summary.addRaw(body).write()
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const previous = comments.find((comment) => comment.body?.includes(marker))
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
