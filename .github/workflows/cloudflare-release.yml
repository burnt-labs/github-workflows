name: Burnt Cloudflare Release

on:
  workflow_call:
    inputs:
      quality-policy-path:
        description: Repository-relative quality policy JSONC path
        required: false
        default: .github/quality-policy.jsonc
        type: string
      deployment-policy-path:
        description: Repository-relative deployment policy JSONC path
        required: false
        default: .github/deployment-policy.jsonc
        type: string
      release-tag:
        required: true
        type: string
      release-url:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      operation:
        description: >-
          preview uploads the release target at 0% traffic without serving it;
          deploy serves it. Callers that validate a release before publishing
          pass preview on release:created and deploy on release:published.
        required: false
        default: deploy
        type: string
    secrets:
      # Optional so a caller can use `secrets: inherit` instead, which is what
      # publishing Worker secrets requires. cloudflare-version.yml resolves
      # either form and fails loudly if neither is present.
      cloudflare-account-id:
        required: false
      cloudflare-api-token:
        required: false

permissions:
  contents: read

jobs:
  # Without this, an unrecognized operation skips both preview-release and
  # deploy-release and the run reports success having done nothing.
  validate:
    name: Validate invocation
    runs-on: ubicloud-standard-2
    steps:
      - if: ${{ !contains(fromJSON('["preview","deploy"]'), inputs.operation) }}
        run: |
          echo "::error::operation must be preview or deploy"
          exit 1

  quality:
    needs: validate
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@097d5108730cb869d1b83db72bef5949a16f8037 # v1.3.4
    with:
      quality-policy-path: ${{ inputs.quality-policy-path }}
      deployment-policy-path: ${{ inputs.deployment-policy-path }}
      deployment-required: true

  validate-release-tag:
    name: Validate app release tag
    needs: quality
    runs-on: ubicloud-standard-2
    env:
      PRERELEASE: ${{ inputs.prerelease }}
      RELEASE_PREFIX: ${{ fromJSON(needs.quality.outputs.deployment-policy).releasePrefix }}
      RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - run: |
          tag_prefix=""
          if [ -n "$RELEASE_PREFIX" ]; then tag_prefix="${RELEASE_PREFIX}-"; fi
          stable_pattern="^${tag_prefix}v[0-9]+\.[0-9]+\.[0-9]+$"
          candidate_pattern="^${tag_prefix}v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$"
          expected_pattern="$stable_pattern"
          if [ "$PRERELEASE" = "true" ]; then expected_pattern="$candidate_pattern"; fi
          if [[ ! "$RELEASE_TAG" =~ $expected_pattern ]]; then
            echo "::error::release tag $RELEASE_TAG does not belong to ${RELEASE_PREFIX:-the default release namespace} or match prerelease=$PRERELEASE"
            exit 1
          fi

  preview-release:
    needs: [quality, validate-release-tag]
    if: inputs.operation == 'preview'
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@097d5108730cb869d1b83db72bef5949a16f8037 # v1.3.4
    with:
      operation: preview
      target: release
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ inputs.release-tag }}
      version-message: Release preview ${{ inputs.release-url }}
    secrets: inherit

  deploy-release:
    needs: [quality, validate-release-tag]
    if: >-
      inputs.operation == 'deploy' &&
      inputs.prerelease == false &&
      fromJSON(needs.quality.outputs.deployment-policy).promotionMode == 'manual'
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@097d5108730cb869d1b83db72bef5949a16f8037 # v1.3.4
    with:
      operation: deploy
      target: release
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ inputs.release-tag }}
      version-message: Release ${{ inputs.release-url }}
    secrets: inherit

  annotate-release:
    needs: deploy-release
    runs-on: ubicloud-standard-2
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_URL: ${{ needs.deploy-release.outputs.deployment-url }}
          VERSION_ID: ${{ needs.deploy-release.outputs.version-id }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "## Release deployment"
            echo
            echo "- URL: $RELEASE_URL"
            echo "- Cloudflare version: \`$VERSION_ID\`"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file "$RUNNER_TEMP/body.md"
