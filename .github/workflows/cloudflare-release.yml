name: Burnt Cloudflare Release

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      release-url:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
      operation:
        description: >-
          preview uploads the release target at 0% traffic without serving it;
          deploy serves it. Callers that validate a release before publishing
          pass preview on release:created and deploy on release:published.
        required: false
        default: deploy
        type: string
    secrets:
      cloudflare-account-id:
        required: true
      cloudflare-api-token:
        required: true

permissions:
  contents: read

jobs:
  # Without this, an unrecognized operation skips both preview-release and
  # deploy-release and the run reports success having done nothing.
  validate:
    name: Validate invocation
    runs-on: ubuntu-latest
    steps:
      - if: ${{ !contains(fromJSON('["preview","deploy"]'), inputs.operation) }}
        run: |
          echo "::error::operation must be preview or deploy"
          exit 1

  quality:
    needs: validate
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@77500b27ddeb8d45c6bedcf56369bc8156f3a5a7

  preview-release:
    needs: quality
    if: inputs.operation == 'preview'
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@77500b27ddeb8d45c6bedcf56369bc8156f3a5a7
    with:
      operation: preview
      target: release
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ inputs.release-tag }}
      version-message: Release preview ${{ inputs.release-url }}
    secrets:
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}

  deploy-release:
    needs: quality
    if: >-
      inputs.operation == 'deploy' &&
      inputs.prerelease == false &&
      needs.quality.outputs.promotion-mode == 'manual'
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@77500b27ddeb8d45c6bedcf56369bc8156f3a5a7
    with:
      operation: deploy
      target: release
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ inputs.release-tag }}
      version-message: Release ${{ inputs.release-url }}
    secrets:
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}

  annotate-release:
    needs: deploy-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_URL: ${{ needs.deploy-release.outputs.deployment-url }}
          VERSION_ID: ${{ needs.deploy-release.outputs.version-id }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "## Release deployment"
            echo
            echo "- URL: $RELEASE_URL"
            echo "- Cloudflare version: \`$VERSION_ID\`"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file "$RUNNER_TEMP/body.md"
