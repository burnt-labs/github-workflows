name: Burnt Cloudflare Published Release

on:
  workflow_call:
    inputs:
      release-tag:
        required: true
        type: string
      release-url:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean
    secrets:
      cloudflare-account-id:
        required: true
      cloudflare-api-token:
        required: true

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@dc8b20de30c0204633d572630078e06459fb89b9

  deploy-release:
    needs: quality
    if: >-
      inputs.prerelease == false &&
      needs.quality.outputs.promotion-mode == 'manual'
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@eff35146e19c05447efb38f0cc68e9587a7331c0
    with:
      operation: deploy
      target: release
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ inputs.release-tag }}
      version-message: Release ${{ inputs.release-url }}
    secrets:
      cloudflare-account-id: ${{ secrets.cloudflare-account-id }}
      cloudflare-api-token: ${{ secrets.cloudflare-api-token }}

  annotate-release:
    needs: deploy-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASE_URL: ${{ needs.deploy-release.outputs.deployment-url }}
          VERSION_ID: ${{ needs.deploy-release.outputs.version-id }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "## Release deployment"
            echo
            echo "- URL: $RELEASE_URL"
            echo "- Cloudflare version: \`$VERSION_ID\`"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file "$RUNNER_TEMP/body.md"
