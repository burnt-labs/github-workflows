name: Burnt Cloudflare Version

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target:
        required: true
        type: string
      deployment-policy:
        required: true
        type: string
      quality-policy:
        required: true
        type: string
      version-tag:
        required: true
        type: string
      version-message:
        required: true
        type: string
    secrets:
      # All four are optional and exactly one pair must arrive. A caller either
      # maps the two hyphenated names, or passes `secrets: inherit` — which is
      # what publishing Worker secrets requires, since inherited secrets keep
      # their own names. The organization names are declared rather than just
      # read: actionlint types `secrets` from this block, so an undeclared
      # lookup is an error, and declaring them makes the fallback part of the
      # contract instead of a hidden alternative. `Validate credentials` fails
      # the run if neither pair resolves.
      cloudflare-account-id:
        required: false
      cloudflare-api-token:
        required: false
      BURNT_CLOUDFLARE_ACCOUNT_ID:
        required: false
      BURNT_CLOUDFLARE_API_TOKEN:
        required: false
    outputs:
      version-id:
        value: ${{ jobs.version.outputs.version-id }}
      deployment-url:
        value: ${{ jobs.version.outputs.deployment-url }}
      # Non-empty only when a preview produced no preview URL (Durable Object
      # Workers never get one) and deployment-url fell back to the target.
      preview-note:
        value: ${{ jobs.version.outputs.preview-note }}

permissions:
  contents: read

jobs:
  version:
    name: ${{ inputs.target }} ${{ inputs.operation }}
    runs-on: ${{ fromJSON(inputs.deployment-policy).containers && 'ubicloud-standard-8' || 'ubicloud-standard-4' }}
    concurrency:
      group: cloudflare-${{ github.repository }}-${{ fromJSON(inputs.deployment-policy).workingDirectory }}-${{ fromJSON(inputs.deployment-policy).targets[inputs.target].githubEnvironment }}
      cancel-in-progress: false
    environment:
      name: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].githubEnvironment }}
      url: ${{ steps.metadata.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    outputs:
      version-id: ${{ steps.metadata.outputs.version-id }}
      deployment-url: ${{ steps.metadata.outputs.deployment-url }}
      preview-note: ${{ steps.metadata.outputs.preview-note }}
    defaults:
      run:
        working-directory: ${{ fromJSON(inputs.quality-policy).workingDirectory }}
    steps:
      - name: Validate invocation
        working-directory: ${{ github.workspace }}
        if: >-
          !contains(fromJSON('["preview","deploy"]'), inputs.operation) ||
          !contains(fromJSON('["candidate","release"]'), inputs.target) ||
          (inputs.operation == 'deploy' && contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name))
        run: |
          echo "::error::Invalid operation or target, or a deployment requested from a pull request"
          exit 1
      - name: Validate credentials
        working-directory: ${{ github.workspace }}
        # A caller passing `secrets: inherit` supplies these under the
        # organization names instead of the mapped ones. Either is fine; neither
        # is not. Without this, wrangler-action receives an empty token and
        # fails somewhere less obvious.
        env:
          API_TOKEN: ${{ secrets.cloudflare-api-token || secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.cloudflare-account-id || secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::No Cloudflare credentials. Pass cloudflare-api-token and cloudflare-account-id, or use secrets: inherit with BURNT_CLOUDFLARE_API_TOKEN and BURNT_CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Enable Corepack
        run: corepack enable
      - name: Pin the npm CLI
        # See "npm install-time security" in AGENTS.md. This job runs the
        # consumer's install alongside the Cloudflare API token, so it is the
        # last place to want install semantics that change on their own.
        run: |
          npm install --global npm@12
          if [ "$(npm --version | cut -d. -f1)" != "12" ]; then
            echo "::error::Expected npm 12 on PATH, found $(npm --version). Something is shadowing the pinned CLI."
            exit 1
          fi
      - name: Install
        run: ${{ fromJSON(inputs.quality-policy).commands.install }}
      - name: Checkout central environment tools
        if: >-
          fromJSON(inputs.deployment-policy).environmentSecret != '' ||
          fromJSON(inputs.deployment-policy).buildAssets != null ||
          fromJSON(inputs.deployment-policy).targets[inputs.target].buildVariables != null
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnt-labs/github-workflows
          ref: 41373a846dad02cfec19503d781e89b3fbf81d69 # unreleased
          path: .burnt-workflows
          persist-credentials: false
      - name: Materialize public Worker variables
        if: fromJSON(inputs.deployment-policy).environmentSecret != ''
        working-directory: ${{ github.workspace }}
        env:
          DEPLOYMENT_POLICY: ${{ inputs.deployment-policy }}
          TARGET: ${{ inputs.target }}
          ENVIRONMENT_JSON: ${{ secrets[fromJSON(inputs.deployment-policy).environmentSecret] }}
        run: node .burnt-workflows/scripts/env-json.bundle.mjs prepare
      - name: Prepare public frontend build inputs
        if: >-
          fromJSON(inputs.deployment-policy).buildAssets != null ||
          fromJSON(inputs.deployment-policy).targets[inputs.target].buildVariables != null
        working-directory: ${{ github.workspace }}
        env:
          DEPLOYMENT_POLICY: ${{ inputs.deployment-policy }}
          TARGET: ${{ inputs.target }}
          VERSION_TAG: ${{ inputs.version-tag }}
          BUILD_VARIABLES: ${{ toJSON(vars) }}
          BUILD_SECRETS: ${{ toJSON(secrets) }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id || secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token || secrets.BURNT_CLOUDFLARE_API_TOKEN }}
        run: node .burnt-workflows/scripts/frontend-build.bundle.mjs
      - name: Prepare target configuration
        if: fromJSON(inputs.deployment-policy).targets[inputs.target].commands.prepare != null
        working-directory: ${{ fromJSON(inputs.deployment-policy).workingDirectory }}
        run: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].commands.prepare }}
      - name: Build
        run: ${{ fromJSON(inputs.quality-policy).commands.build }}
      # Every wrangler command in this job takes its --env fragment from here,
      # never from the policy directly, so all of them agree.
      #
      # A build tool such as the Cloudflare Vite plugin emits an
      # environment-RESOLVED wrangler.json: no `env` section, `name` already the
      # environment's Worker name, and a top-level `targetEnvironment` naming
      # the environment it was built for. Passing --env to that file does not
      # select anything — wrangler warns that the env section is missing and
      # appends "-<env>" to the name again, so a staging build deploys as
      # "<worker>-staging-staging" and a production one moves custom domains
      # onto a Worker with no secrets. So for a resolved config --env is
      # dropped, after checking `targetEnvironment` against the target's
      # wranglerEnv: a staging build must never deploy as production.
      #
      # The config is located the way wrangler locates it: the target's
      # wranglerConfig when declared; otherwise wrangler.json, wrangler.jsonc,
      # then wrangler.toml, each searched upward from the working directory,
      # except that a `.wrangler/deploy/config.json` redirect, found the same
      # way, wins over those. A config with no
      # `targetEnvironment` keeps --env exactly as before. JSONC and TOML are
      # not parsed: a file JSON.parse rejects is treated as unresolved, unless
      # it mentions `targetEnvironment`, which fails rather than guess.
      # `single` topology has no wrangler environment and is untouched.
      - name: Resolve Wrangler environment
        id: wrangler-env
        working-directory: ${{ fromJSON(inputs.deployment-policy).workingDirectory }}
        env:
          REQUESTED_ENV: ${{ fromJSON(inputs.deployment-policy).topology != 'single' && fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerEnv || '' }}
          WRANGLER_CONFIG: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerConfig || '' }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const requested = process.env.REQUESTED_ENV || "";
          const output = (flag) =>
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `env-flag=${flag}\n`);
          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };
          const findUp = (name) => {
            for (let dir = process.cwd(); ; dir = path.dirname(dir)) {
              const candidate = path.join(dir, name);
              if (fs.existsSync(candidate)) return candidate;
              if (path.dirname(dir) === dir) return undefined;
            }
          };
          const locate = () => {
            if (process.env.WRANGLER_CONFIG) {
              return path.resolve(process.env.WRANGLER_CONFIG);
            }
            const user = ["wrangler.json", "wrangler.jsonc", "wrangler.toml"]
              .map(findUp)
              .find(Boolean);
            const redirect = findUp(".wrangler/deploy/config.json");
            if (redirect) {
              try {
                const { configPath } = JSON.parse(fs.readFileSync(redirect, "utf8"));
                if (configPath) return path.resolve(path.dirname(redirect), configPath);
              } catch {
                // wrangler rejects an unreadable redirect itself.
              }
            }
            return user;
          };
          const main = () => {
            if (requested === "") return output("");
            const flag = `--env ${requested}`;
            const config = locate();
            if (!config || !fs.existsSync(config)) return output(flag);
            const text = fs.readFileSync(config, "utf8");
            const shown = path.relative(process.cwd(), config) || config;
            let parsed;
            try {
              parsed = JSON.parse(text);
            } catch {
              if (/targetEnvironment/.test(text)) {
                fail(`${shown} mentions targetEnvironment but is not plain JSON, so the environment it was built for cannot be verified. Refusing to deploy target environment "${requested}".`);
              }
              return output(flag);
            }
            const built = parsed?.targetEnvironment;
            if (built === undefined || built === null || built === "") return output(flag);
            if (built !== requested) {
              fail(`${shown} was built for Wrangler environment "${built}", but this target deploys to "${requested}". Rebuild for "${requested}"; refusing to deploy one environment's build as another.`);
            }
            console.log(`::notice::${shown} is already resolved for Wrangler environment "${built}"; running wrangler without --env.`);
            return output("");
          };
          main();
          NODE
      - name: Collect Worker secrets
        id: worker-secrets
        if: >-
          inputs.operation == 'deploy' &&
          fromJSON(inputs.deployment-policy).workerSecrets[0] != null &&
          fromJSON(inputs.deployment-policy).environmentSecret == ''
        env:
          # Everything the caller inherited, the Cloudflare token included, so
          # the allowlist below is the whole safety property. The validator also
          # rejects the credential names and GITHUB_TOKEN outright.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          WANTED: ${{ toJSON(fromJSON(inputs.deployment-policy).workerSecrets) }}
        run: |
          missing=$(jq -rn --argjson all "$ALL_SECRETS" --argjson want "$WANTED" \
            '$want | map(select(($all[.] // "") == "")) | join(" ")')
          if [ -n "$missing" ]; then
            echo "::error::Declared workerSecrets not set in this GitHub Environment: $missing"
            exit 1
          fi
          jq -n --argjson all "$ALL_SECRETS" --argjson want "$WANTED" \
            '$want | map({key: ., value: $all[.]}) | from_entries' > "$RUNNER_TEMP/worker-secrets.json"
          echo "Publishing $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/worker-secrets.json")"
      - name: Materialize bundled Worker secrets
        id: bundle-secrets
        if: >-
          inputs.operation == 'deploy' &&
          fromJSON(inputs.deployment-policy).environmentSecret != '' &&
          fromJSON(inputs.deployment-policy).workerSecrets[0] != null
        working-directory: ${{ github.workspace }}
        env:
          DEPLOYMENT_POLICY: ${{ inputs.deployment-policy }}
          TARGET: ${{ inputs.target }}
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT_JSON: ${{ secrets[fromJSON(inputs.deployment-policy).environmentSecret] }}
        run: node .burnt-workflows/scripts/env-json.bundle.mjs secrets
      # D1 migrations declared in the deployment policy apply here, before the
      # new version deploys, so the schema the code was written against exists
      # by the time that code serves. Deploy only, never preview — the same
      # boundary Worker secrets draw below: a preview must not mutate the
      # target's database, and under chain topology "the target's database" is
      # mainnet's.
      #
      # Two steps for a mundane reason, not the secrets steps' trust split:
      # wrangler-action takes a literal command string, and the policy holds a
      # list, so a plain step renders the list into one command per line first.
      # `d1 migrations apply` is idempotent — already-applied migrations are
      # skipped — so a re-run or a second target on the same database is safe.
      - name: Plan D1 migrations
        id: d1-migrations
        if: >-
          inputs.operation == 'deploy' &&
          fromJSON(inputs.deployment-policy).d1Migrations[0] != null
        env:
          DATABASES: ${{ toJSON(fromJSON(inputs.deployment-policy).d1Migrations) }}
          ENV_FLAG: ${{ steps.wrangler-env.outputs.env-flag }}
          CONFIG_FLAG: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerConfig != null && format('--config {0}', fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerConfig) || '' }}
        run: |
          {
            echo 'commands<<D1_COMMANDS'
            # Database names are validated to a letters-digits-hyphens shape,
            # so interpolating them into a command line cannot smuggle flags.
            jq -r --arg env "$ENV_FLAG" --arg config "$CONFIG_FLAG" \
              '.[] | "d1 migrations apply \(.) --remote" + (if $env == "" then "" else " \($env)" end) + (if $config == "" then "" else " \($config)" end)' \
              <<< "$DATABASES"
            echo 'D1_COMMANDS'
          } >> "$GITHUB_OUTPUT"
      - name: Apply D1 migrations
        if: steps.d1-migrations.outcome == 'success'
        # The same pinned action as the deploy below, for the same reason the
        # secrets step uses it: wrangler out of the consumer's node_modules
        # would put a caller-resolved binary next to the deployment credential.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.cloudflare-api-token || secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.cloudflare-account-id || secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          # deployment-policy.workingDirectory, matching the deploy step: the
          # migrations directory resolves relative to the same wrangler
          # configuration the deploy reads, so the schema applied is the one
          # the deployed Worker was built against.
          workingDirectory: ${{ fromJSON(inputs.deployment-policy).workingDirectory }}
          packageManager: ${{ fromJSON(inputs.deployment-policy).packageManager }}
          command: ${{ steps.d1-migrations.outputs.commands }}
      # Developers do not have Cloudflare access, so `wrangler secret put` is not
      # available to them and GitHub is the only place they can hold a secret.
      # This carries the declared ones across.
      #
      # Deploy only, never preview. A preview must not change what a target's
      # secrets are, and on a chain repository the release target's secrets are
      # mainnet's. A preview therefore runs against whatever secrets are already
      # on the Worker, which is the same thing it does for bindings.
      #
      # This step writes the file; the deploy step below uploads it with the new
      # version (`deploy --secrets-file`). A separate `wrangler secret` edit is
      # deliberately not used: it edits the *latest* version and fails with
      # Cloudflare error 10215 when that version is an undeployed upload, which
      # is the normal state after any preview or single-topology candidate.
      #
      # Secret collection runs only runner-provided jq; the upload uses a
      # pinned action. Consumer prepare/verification commands receive no deploy
      # credentials. PR events are rejected for deploy operations.
      - name: Upload or deploy Worker version
        id: wrangler
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.cloudflare-api-token || secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.cloudflare-account-id || secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ fromJSON(inputs.deployment-policy).workingDirectory }}
          packageManager: ${{ fromJSON(inputs.deployment-policy).packageManager }}
          # The --env fragment comes from "Resolve Wrangler environment": empty
          # under single topology and for an environment-resolved build output.
          #
          # --secrets-file is written as `cond && format(…) || ''`, never
          # `!cond && '' || …`: GitHub's && / || return the last evaluated
          # operand and '' is falsy, so the second form always falls through. The collect step succeeds only
          # on a deploy with a non-empty workerSecrets, so a preview never gets
          # the flag. It needs wrangler 4.74.0 or newer.
          command: >-
            ${{ inputs.operation == 'preview' && 'versions upload' || 'deploy' }}
            ${{ steps.wrangler-env.outputs.env-flag }}
            ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerConfig != null && format('--config {0}', fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerConfig) || '' }}
            --message=${{ inputs.version-tag }}
            --tag "${{ inputs.version-tag }}"
            ${{ (steps.worker-secrets.outcome == 'success' || steps.bundle-secrets.outcome == 'success') && format('--secrets-file {0}/worker-secrets.json', runner.temp) || '' }}
      - name: Remove Worker secrets file
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
      - name: Collect verification secrets
        id: verification-secrets
        if: >-
          inputs.operation == 'deploy' && steps.wrangler.outcome == 'success' &&
          fromJSON(inputs.deployment-policy).verificationSecrets[0] != null
        working-directory: ${{ github.workspace }}
        env:
          DEPLOYMENT_POLICY: ${{ inputs.deployment-policy }}
          TARGET: ${{ inputs.target }}
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT_JSON: ${{ secrets[fromJSON(inputs.deployment-policy).environmentSecret] }}
        run: node .burnt-workflows/scripts/env-json.bundle.mjs verification
      - name: Verify deployment
        if: >-
          inputs.operation == 'deploy' &&
          fromJSON(inputs.deployment-policy).targets[inputs.target].commands.afterDeploy != null &&
          fromJSON(inputs.deployment-policy).verificationSecrets[0] == null
        working-directory: ${{ fromJSON(inputs.deployment-policy).workingDirectory }}
        run: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].commands.afterDeploy }}
      - name: Verify deployment with scoped secrets
        if: >-
          inputs.operation == 'deploy' && steps.verification-secrets.outcome == 'success'
        working-directory: ${{ fromJSON(inputs.deployment-policy).workingDirectory }}
        env:
          WORKER_VERIFICATION_SECRETS_FILE: ${{ runner.temp }}/worker-verification-secrets.json
        run: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].commands.afterDeploy }}
      - name: Remove verification secrets file
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/worker-verification-secrets.json"
      - name: Extract Cloudflare metadata
        id: metadata
        env:
          COMMAND_OUTPUT: ${{ steps.wrangler.outputs.command-output }}
          ACTION_URL: ${{ steps.wrangler.outputs.deployment-url }}
          TARGET_URL: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].url }}
          OPERATION: ${{ inputs.operation }}
        run: |
          VERSION_ID=$(printf '%s' "$COMMAND_OUTPUT" | grep -oE '(Worker )?Version ID: +[a-f0-9-]+' | head -1 | grep -oE '[a-f0-9-]{8,}' || true)
          PREVIEW_URL=$(printf '%s' "$COMMAND_OUTPUT" | grep -oE 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' | head -1 || true)
          PREVIEW_NOTE=""
          if [ "$OPERATION" = "preview" ]; then
            DEPLOYMENT_URL="${PREVIEW_URL:-$ACTION_URL}"
            if [ -z "$DEPLOYMENT_URL" ]; then
              # Cloudflare does not issue preview URLs for Workers that
              # implement a Durable Object, Containers included — the upload
              # succeeded and the version exists at 0% traffic, there is just
              # no URL that serves it. Fall back to the target URL so the
              # GitHub Environment and the PR comment point somewhere real,
              # and carry a note so nobody mistakes it for the preview.
              DEPLOYMENT_URL="$TARGET_URL"
              PREVIEW_NOTE="no preview URL: Cloudflare does not generate them for Durable Object Workers; the version is uploaded at 0% traffic and the URL above is the live target"
            fi
          else
            DEPLOYMENT_URL="${TARGET_URL:-$ACTION_URL}"
          fi
          if [ -z "$VERSION_ID" ] || [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Cloudflare output did not contain version metadata"
            exit 1
          fi
          {
            echo "version-id=$VERSION_ID"
            echo "deployment-url=$DEPLOYMENT_URL"
            echo "preview-note=$PREVIEW_NOTE"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare ${{ inputs.target }} ${{ inputs.operation }}"
            echo "- Tag: \`${{ inputs.version-tag }}\`"
            echo "- Version: \`$VERSION_ID\`"
            echo "- URL: $DEPLOYMENT_URL"
            if [ -n "$PREVIEW_NOTE" ]; then
              echo "- Note: $PREVIEW_NOTE"
            fi
            echo "- Source: ${{ inputs.version-message }}"
          } >> "$GITHUB_STEP_SUMMARY"
