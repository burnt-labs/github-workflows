name: Burnt Cloudflare Version

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      target:
        required: true
        type: string
      deployment-policy:
        required: true
        type: string
      quality-policy:
        required: true
        type: string
      version-tag:
        required: true
        type: string
      version-message:
        required: true
        type: string
    secrets:
      # Optional so that a caller can use `secrets: inherit` instead, which is
      # what publishing Worker secrets requires — inherited secrets arrive under
      # their own names, so these two would be empty. Resolved with a fallback
      # to the organization names below, and a job fails loudly if neither is
      # present rather than handing wrangler an empty token.
      cloudflare-account-id:
        required: false
      cloudflare-api-token:
        required: false
    outputs:
      version-id:
        value: ${{ jobs.version.outputs.version-id }}
      deployment-url:
        value: ${{ jobs.version.outputs.deployment-url }}

permissions:
  contents: read

jobs:
  version:
    name: ${{ inputs.target }} ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].githubEnvironment }}
      url: ${{ steps.metadata.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    outputs:
      version-id: ${{ steps.metadata.outputs.version-id }}
      deployment-url: ${{ steps.metadata.outputs.deployment-url }}
    defaults:
      run:
        working-directory: ${{ fromJSON(inputs.quality-policy).workingDirectory }}
    steps:
      - name: Validate invocation
        if: >-
          !contains(fromJSON('["preview","deploy"]'), inputs.operation) ||
          !contains(fromJSON('["candidate","release"]'), inputs.target)
        run: |
          echo "::error::Invalid operation or target"
          exit 1
      - name: Validate credentials
        # A caller passing `secrets: inherit` supplies these under the
        # organization names instead of the mapped ones. Either is fine; neither
        # is not. Without this, wrangler-action receives an empty token and
        # fails somewhere less obvious.
        env:
          API_TOKEN: ${{ secrets.cloudflare-api-token || secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.cloudflare-account-id || secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::No Cloudflare credentials. Pass cloudflare-api-token and cloudflare-account-id, or use secrets: inherit with BURNT_CLOUDFLARE_API_TOKEN and BURNT_CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: ${{ fromJSON(inputs.quality-policy).commands.install }}
      - name: Build
        run: ${{ fromJSON(inputs.quality-policy).commands.build }}
      # Developers do not have Cloudflare access, so `wrangler secret put` is
      # not available to them and GitHub is the only place they can hold a
      # secret. This carries the declared ones across before the version is
      # created, so the version picks them up.
      #
      # Only names listed in the policy are forwarded. `toJSON(secrets)` here
      # contains everything the caller inherited — including the Cloudflare API
      # token — so an allowlist is the whole safety property. The validator also
      # rejects the credential names outright.
      - name: Publish Worker secrets
        if: fromJSON(inputs.deployment-policy).workerSecrets[0] != null
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.cloudflare-api-token || secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.cloudflare-account-id || secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          WANTED: ${{ toJSON(fromJSON(inputs.deployment-policy).workerSecrets) }}
          ENV_FLAG: ${{ fromJSON(inputs.deployment-policy).topology != 'single' && format('--env {0}', fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerEnv) || '' }}
          PACKAGE_MANAGER: ${{ fromJSON(inputs.deployment-policy).packageManager }}
        run: |
          missing=$(jq -rn --argjson all "$ALL_SECRETS" --argjson want "$WANTED" \
            '$want | map(select(($all[.] // "") == "")) | join(" ")')
          if [ -n "$missing" ]; then
            echo "::error::Declared workerSecrets not set in this GitHub Environment: $missing"
            exit 1
          fi
          jq -n --argjson all "$ALL_SECRETS" --argjson want "$WANTED" \
            '$want | map({key: ., value: $all[.]}) | from_entries' > "$RUNNER_TEMP/secrets.json"
          echo "Publishing $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/secrets.json")"
          # shellcheck disable=SC2086
          "$PACKAGE_MANAGER" exec wrangler secret bulk "$RUNNER_TEMP/secrets.json" $ENV_FLAG
      - name: Upload or deploy Worker version
        id: wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.cloudflare-api-token || secrets.BURNT_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.cloudflare-account-id || secrets.BURNT_CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ fromJSON(inputs.deployment-policy).workingDirectory }}
          packageManager: ${{ fromJSON(inputs.deployment-policy).packageManager }}
          # The --env fragment is written as `topology != 'single' && … || ''`
          # and not `topology == 'single' && '' || …`. GitHub's && / || return
          # the last evaluated operand, and an empty string is falsy — so the
          # second form falls through to the right-hand side every time and
          # would always pass --env. Under single topology there is no wrangler
          # environment to name and passing one fails the deploy.
          command: >-
            ${{ inputs.operation == 'preview' && 'versions upload' || 'deploy' }}
            ${{ fromJSON(inputs.deployment-policy).topology != 'single' && format('--env {0}', fromJSON(inputs.deployment-policy).targets[inputs.target].wranglerEnv) || '' }}
            --message "${{ inputs.version-message }}"
            --tag "${{ inputs.version-tag }}"
      - name: Extract Cloudflare metadata
        id: metadata
        env:
          COMMAND_OUTPUT: ${{ steps.wrangler.outputs.command-output }}
          ACTION_URL: ${{ steps.wrangler.outputs.deployment-url }}
          TARGET_URL: ${{ fromJSON(inputs.deployment-policy).targets[inputs.target].url }}
          OPERATION: ${{ inputs.operation }}
        run: |
          VERSION_ID=$(printf '%s' "$COMMAND_OUTPUT" | grep -oE '(Worker )?Version ID: +[a-f0-9-]+' | head -1 | grep -oE '[a-f0-9-]{8,}' || true)
          PREVIEW_URL=$(printf '%s' "$COMMAND_OUTPUT" | grep -oE 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' | head -1 || true)
          if [ "$OPERATION" = "preview" ]; then
            DEPLOYMENT_URL="${PREVIEW_URL:-$ACTION_URL}"
          else
            DEPLOYMENT_URL="${TARGET_URL:-$ACTION_URL}"
          fi
          if [ -z "$VERSION_ID" ] || [ -z "$DEPLOYMENT_URL" ]; then
            echo "::error::Cloudflare output did not contain version metadata"
            exit 1
          fi
          echo "version-id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "deployment-url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Cloudflare ${{ inputs.target }} ${{ inputs.operation }}"
            echo "- Tag: \`${{ inputs.version-tag }}\`"
            echo "- Version: \`$VERSION_ID\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Source: ${{ inputs.version-message }}"
          } >> "$GITHUB_STEP_SUMMARY"
