name: Burnt Cloudflare Main Promotion

on:
  workflow_call:
    secrets:
      # Optional so a caller can use `secrets: inherit` instead, which is what
      # publishing Worker secrets requires. cloudflare-version.yml resolves
      # either form and fails loudly if neither is present.
      cloudflare-account-id:
        required: false
      cloudflare-api-token:
        required: false

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@8ad57077de69850b11de82d286ae0cbb23f51aa5

  metadata:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      candidate-tag: ${{ steps.metadata.outputs.candidate-tag }}
      release-tag: ${{ steps.metadata.outputs.release-tag }}
      candidate-url: ${{ steps.urls.outputs.candidate-url }}
      release-url: ${{ steps.urls.outputs.release-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnt-labs/github-workflows
          ref: 8ad57077de69850b11de82d286ae0cbb23f51aa5
          path: .burnt-workflows
      - name: Read stable release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > "$RUNNER_TEMP/release-tags.txt"
      - id: metadata
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          VERSION_FILE: ${{ fromJSON(needs.quality.outputs.deployment-policy).versionFile }}
        run: |
          RELEASE_TAGS="$(cat "$RUNNER_TEMP/release-tags.txt")" \
            node .burnt-workflows/scripts/release-metadata.mjs
      - id: urls
        env:
          CANDIDATE_TAG: ${{ steps.metadata.outputs.candidate-tag }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release-tag }}
        run: |
          echo "candidate-url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "release-url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  deploy-candidate:
    needs: [quality, metadata]
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@8ad57077de69850b11de82d286ae0cbb23f51aa5
    with:
      # Under single topology the candidate and the release are the same
      # Worker, so deploying here would serve the merge immediately and there
      # would be nothing left for publishing a release to do. Upload the
      # version at 0% traffic instead; the release deploy promotes it. For
      # standard and chain the candidate is a separate environment and is
      # deployed as before.
      operation: ${{ fromJSON(needs.quality.outputs.deployment-policy).topology == 'single' && 'preview' || 'deploy' }}
      target: candidate
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ needs.metadata.outputs.candidate-tag }}
      version-message: RC ${{ needs.metadata.outputs.candidate-url }}
    secrets: inherit

  preview-release:
    needs: [quality, metadata, deploy-candidate]
    if: fromJSON(needs.quality.outputs.deployment-policy).previewReleaseOnMain
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@8ad57077de69850b11de82d286ae0cbb23f51aa5
    with:
      operation: preview
      target: release
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ needs.metadata.outputs.candidate-tag }}
      version-message: RC ${{ needs.metadata.outputs.candidate-url }}
    secrets: inherit

  create-releases:
    needs: [quality, metadata, deploy-candidate, preview-release]
    # preview-release is skipped when previewReleaseOnMain is false, and a
    # skipped need would otherwise skip this job too.
    if: >-
      !cancelled() &&
      needs.deploy-candidate.result == 'success' &&
      (needs.preview-release.result == 'success' ||
       needs.preview-release.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-url: ${{ steps.release.outputs.release-url }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.metadata.outputs.candidate-tag }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release-tag }}
          CANDIDATE_URL: ${{ needs.deploy-candidate.outputs.deployment-url }}
          CANDIDATE_VERSION: ${{ needs.deploy-candidate.outputs.version-id }}
          RELEASE_PREVIEW_URL: ${{ needs.preview-release.outputs.deployment-url }}
          RELEASE_PREVIEW_VERSION: ${{ needs.preview-release.outputs.version-id }}
        run: |
          {
            echo "## Release candidate"
            echo
            echo "- Candidate deployment: $CANDIDATE_URL"
            echo "- Candidate Cloudflare version: \`$CANDIDATE_VERSION\`"
            if [ -n "$RELEASE_PREVIEW_URL" ]; then
              echo "- Release preview: $RELEASE_PREVIEW_URL"
              echo "- Release-preview Cloudflare version: \`$RELEASE_PREVIEW_VERSION\`"
            fi
            echo "- Commit: \`${{ github.sha }}\`"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$CANDIDATE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$CANDIDATE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$CANDIDATE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$CANDIDATE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --prerelease \
              --title "$CANDIDATE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --draft \
              --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "release-url=${{ github.server_url }}/${{ github.repository }}/releases/tag/$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  deploy-release-automatic:
    needs: [quality, metadata, create-releases]
    if: needs.quality.outputs.promotionMode == 'automatic'
    permissions:
      contents: read
      deployments: write
    uses: burnt-labs/github-workflows/.github/workflows/cloudflare-version.yml@8ad57077de69850b11de82d286ae0cbb23f51aa5
    with:
      operation: deploy
      target: release
      quality-policy: ${{ needs.quality.outputs.quality-policy }}
      deployment-policy: ${{ needs.quality.outputs.deployment-policy }}
      version-tag: ${{ needs.metadata.outputs.release-tag }}
      version-message: Release ${{ needs.create-releases.outputs.release-url }}
    secrets: inherit

  publish-automatic-release:
    needs: [metadata, deploy-release-automatic]
    if: needs.deploy-release-automatic.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release-tag }}
          RELEASE_URL: ${{ needs.deploy-release-automatic.outputs.deployment-url }}
          VERSION_ID: ${{ needs.deploy-release-automatic.outputs.version-id }}
        run: |
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json body --jq .body > "$RUNNER_TEMP/body.md"
          {
            echo
            echo "## Release deployment"
            echo
            echo "- URL: $RELEASE_URL"
            echo "- Cloudflare version: \`$VERSION_ID\`"
          } >> "$RUNNER_TEMP/body.md"
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --notes-file "$RUNNER_TEMP/body.md"
