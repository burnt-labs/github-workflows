name: Burnt Phala Deploy

on:
  workflow_call:
    inputs:
      target:
        description: Semantic deployment target (candidate or release)
        required: true
        type: string
      operation:
        description: deploy preserves candidate auto-creation; update requires an existing CVM; setup explicitly creates an absent CVM
        required: false
        default: deploy
        type: string
    outputs:
      app-id:
        description: Exact app identity for explicit setup/update acceptance
        value: ${{ jobs.deploy.outputs.app-id }}
      compose-hash:
        description: Platform-reported compose hash for explicit setup/update acceptance
        value: ${{ jobs.deploy.outputs.compose-hash }}
      deployment-url:
        description: Public HTTPS endpoint that passed the health check (the target's publicUrl when set, otherwise the one Phala reports)
        value: ${{ jobs.deploy.outputs.deployment-url }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate invocation
    runs-on: ubicloud-standard-2
    steps:
      - name: Validate target
        if: ${{ !contains(fromJSON('["candidate","release"]'), inputs.target) }}
        run: |
          echo "::error::target must be candidate or release"
          exit 1

      - name: Validate operation
        env:
          PHALA_OPERATION: ${{ inputs.operation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$PHALA_OPERATION" in
            deploy) ;;
            setup|update)
              if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                echo "::error::setup requires a manual run from the caller's default branch"
                exit 1
              fi
              ;;
            *) echo "::error::operation must be deploy, update or setup"; exit 1 ;;
          esac

  policy:
    name: Phala policy
    needs: validate
    runs-on: ubicloud-standard-2
    outputs:
      phala: ${{ steps.policy.outputs.phala }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout central policy tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnt-labs/github-workflows
          ref: fb985d64a0a97b69ffb51598ce5e75bb01234fd0 # unreleased
          path: .burnt-workflows
      - id: policy
        name: Require and validate Phala policy
        run: node .burnt-workflows/scripts/policy.bundle.mjs --phala

  quality:
    needs: policy
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@18ac34fe76ba39f6712cb9a6e503ad3cf5e57949 # unreleased

  deploy:
    name: Phala ${{ inputs.target }}
    needs: [policy, quality]
    runs-on: ubicloud-standard-8
    environment:
      name: ${{ fromJSON(needs.policy.outputs.phala).targets[inputs.target].githubEnvironment }}
      url: ${{ steps.phala-url.outputs.deployment-url }}
    concurrency:
      group: phala-${{ github.repository }}-${{ fromJSON(needs.policy.outputs.phala).targets[inputs.target].cvmName }}
      cancel-in-progress: ${{ inputs.operation == 'deploy' }}
    permissions:
      contents: read
      deployments: write
      packages: write
    outputs:
      deployment-url: ${{ steps.phala-url.outputs.deployment-url }}
      compose-hash: ${{ steps.platform.outputs.compose-hash }}
      app-id: ${{ steps.platform.outputs.app-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Checkout central setup tools
        if: inputs.operation != 'deploy'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnt-labs/github-workflows
          ref: fb985d64a0a97b69ffb51598ce5e75bb01234fd0 # unreleased
          path: .burnt-phala-tools
          persist-credentials: false
      - name: Move setup tooling outside the image build context
        if: inputs.operation != 'deploy'
        run: |
          test ! -e "$RUNNER_TEMP/burnt-phala-tools"
          mv .burnt-phala-tools "$RUNNER_TEMP/burnt-phala-tools"
      - name: Resolve image
        id: image
        env:
          IMAGE_NAME: ${{ fromJSON(needs.policy.outputs.phala).image.name }}
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "repository=ghcr.io/${repository}/${IMAGE_NAME}"
            echo "image=ghcr.io/${repository}/${IMAGE_NAME}:${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"
      - name: Collect deployment credentials and runtime configuration
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARIABLES: ${{ toJSON(vars) }}
          API_KEY_NAME: ${{ fromJSON(needs.policy.outputs.phala).credentials.phalaApiKeySecret }}
          REGISTRY_PASSWORD_NAME: ${{ fromJSON(needs.policy.outputs.phala).credentials.registryPasswordSecret }}
          SECRET_NAMES: ${{ toJSON(fromJSON(needs.policy.outputs.phala).runtimeSecrets) }}
          VARIABLE_NAMES: ${{ toJSON(fromJSON(needs.policy.outputs.phala).runtimeVariables) }}
          REGISTRY_USERNAME: ${{ fromJSON(needs.policy.outputs.phala).image.registryUsername }}
          TARGET_CONFIGURATION: ${{ toJSON(fromJSON(needs.policy.outputs.phala).targets[inputs.target]) }}
          RUNTIME_VARIABLES: ${{ toJSON(fromJSON(needs.policy.outputs.phala).runtimeVariables) }}
          PHALA_OPERATION: ${{ inputs.operation }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const secrets = JSON.parse(process.env.ALL_SECRETS);
          const variables = JSON.parse(process.env.ALL_VARIABLES);
          const secretNames = JSON.parse(process.env.SECRET_NAMES);
          const variableNames = JSON.parse(process.env.VARIABLE_NAMES);
          const target = JSON.parse(process.env.TARGET_CONFIGURATION);
          // Default deploys retain legacy per-key variables; bundles are for setup/update.
          const useConfiguration = (process.env.PHALA_OPERATION || "deploy") !== "deploy" && target.configuration;
          if (useConfiguration) {
            const { resolveTargetConfiguration } = await import(`${process.env.RUNNER_TEMP}/burnt-phala-tools/scripts/phala-configuration.mjs`);
            const resolved = resolveTargetConfiguration(target, secrets[target.configuration.secret], JSON.parse(process.env.RUNTIME_VARIABLES));
            Object.assign(variables, resolved.values);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/phala-target.json`, JSON.stringify({ ...resolved.target, publicValues: resolved.values }), { mode: 0o600 });
          }
          const apiKey = secrets[process.env.API_KEY_NAME];
          const registryPassword = secrets[process.env.REGISTRY_PASSWORD_NAME];
          const missing = [
            ...(!apiKey ? [process.env.API_KEY_NAME] : []),
            ...(!registryPassword ? [process.env.REGISTRY_PASSWORD_NAME] : []),
            ...secretNames.filter((name) => !secrets[name]),
            ...variableNames.filter((name) => !variables[name]),
          ];
          if (missing.length) {
            process.stderr.write(`::error::Declared Phala configuration not set: ${missing.join(" ")}\n`);
            process.exit(1);
          }
          const environment = Object.fromEntries([
            ...secretNames.map((name) => [name, secrets[name]]),
            ...(!useConfiguration ? variableNames.map((name) => [name, variables[name]]) : []),
            ["DSTACK_DOCKER_REGISTRY", "ghcr.io"],
            ["DSTACK_DOCKER_USERNAME", process.env.REGISTRY_USERNAME],
            ["DSTACK_DOCKER_PASSWORD", registryPassword],
          ]);
          const quote = (value) => `"${String(value)
            .replaceAll("\\", "\\\\")
            .replaceAll("\n", "\\n")
            .replaceAll("\r", "\\r")
            .replaceAll('"', '\\"')}"`;
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/phala-api-key`, apiKey, { mode: 0o600 });
          fs.writeFileSync(
            `${process.env.RUNNER_TEMP}/phala.env`,
            Object.entries(environment).map(([key, value]) => `${key}=${quote(value)}`).join("\n") + "\n",
            { mode: 0o600 },
          );
          NODE
          if [ "$PHALA_OPERATION" = deploy ]; then
          case "$(npx --yes phala@1.1.20 --version)" in
            v1.1.20 | v1.1.20+*) ;;
            *)
              echo "::error::Expected Phala CLI 1.1.20"
              exit 1
              ;;
          esac
          fi
      - name: Validate initial setup before image publication
        if: inputs.operation != 'deploy'
        env:
          PHALA_POLICY: ${{ needs.policy.outputs.phala }}
          PHALA_OPERATION: ${{ inputs.operation }}
          TARGET_ROLE: ${{ inputs.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node "$RUNNER_TEMP/burnt-phala-tools/scripts/phala-setup-cli.mjs" preflight
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR for push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ fromJSON(needs.policy.outputs.phala).image.context }}
          file: ${{ fromJSON(needs.policy.outputs.phala).image.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: ${{ inputs.operation != 'deploy' && format('GIT_SHA={0}', github.sha) || '' }}
          provenance: ${{ inputs.operation != 'deploy' && 'mode=max' || '' }}
          sbom: ${{ inputs.operation != 'deploy' }}
      # dstack hashes the compose text it is given, and that hash is what a
      # relying party's allowlist checks. Substituting the image here rather
      # than delivering it as a CVM environment variable is the whole point:
      # expanded, the attested compose identity names the exact bytes running;
      # left as a variable, it names the topology and nothing about the
      # application. The reference is by digest, not by the commit tag, because
      # a tag can be repointed after the deploy.
      - name: Render the compose file
        id: compose
        env:
          COMPOSE_FILE: ${{ fromJSON(needs.policy.outputs.phala).composeFile }}
          WORKING_DIRECTORY: ${{ fromJSON(needs.policy.outputs.phala).workingDirectory }}
          IMAGE_VARIABLE: ${{ fromJSON(needs.policy.outputs.phala).image.composeVariable }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cd "$WORKING_DIRECTORY"
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const variable = process.env.IMAGE_VARIABLE;
          const digest = process.env.IMAGE_DIGEST;
          if (!/^sha256:[0-9a-f]{64}$/.test(digest ?? "")) {
            process.stderr.write(`::error::The image push reported no usable digest: ${digest}\n`);
            process.exit(1);
          }
          const reference = `${process.env.IMAGE_REPOSITORY}@${digest}`;
          let source = fs.readFileSync(process.env.COMPOSE_FILE, "utf8");
          const targetFile = path.join(process.env.RUNNER_TEMP, "phala-target.json");
          if (fs.existsSync(targetFile)) {
            const { publicValues } = JSON.parse(fs.readFileSync(targetFile, "utf8"));
            for (const [key, value] of Object.entries(publicValues)) {
              const expression = new RegExp(`\\$\\{${key}(:\\?[^}]*)?\\}`, "g");
              if (!expression.test(source)) throw new Error("Declared measured configuration is missing from compose");
              // Measured values must occupy a whole quoted mapping value; bare
              // scalars such as null, true and 123 would change type in YAML.
              source = source.replace(expression, (match, required, offset) => {
                const before = source.slice(source.lastIndexOf("\n", offset) + 1, offset);
                const after = source.slice(offset + match.length).split("\n", 1)[0];
                const context = /^[ \t]*[A-Za-z_][A-Za-z0-9_]*:[ \t]*(["'])$/.exec(before);
                if (!context || !new RegExp(`^${context[1]}[ \\t]*(?:#.*)?\\r?$`).test(after)) {
                  throw new Error("Measured configuration requires a whole quoted YAML mapping value");
                }
                return value;
              });
              if (source.includes("${" + key + ":") || source.includes("${" + key + "}")) throw new Error("Measured configuration placeholder remains in compose");
            }
          }
          // The two spellings a compose file may use: the bare ${VAR} and the
          // required form ${VAR:?message}. The default form ${VAR:-fallback}
          // is deliberately not matched — a default image reference is one a
          // deploy could silently fall back to, which is the opposite of what
          // an attested compose identity is for. It fails the check below
          // instead. Anything else mentioning the variable is caught there too.
          const placeholder = new RegExp(`\\$\\{${variable}(:\\?[^}]*)?\\}`, "g");
          const rendered = source.replace(placeholder, reference);
          if (rendered === source) {
            process.stderr.write(`::error::${process.env.COMPOSE_FILE} does not reference \${${variable}}\n`);
            process.exit(1);
          }
          if (rendered.includes(variable)) {
            process.stderr.write(`::error::${variable} still appears in the rendered compose file\n`);
            process.exit(1);
          }
          const target = path.join(process.env.RUNNER_TEMP, "phala-compose.yaml");
          fs.writeFileSync(target, rendered);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `file=${target}\n`);
          process.stdout.write(`Deploying ${reference}\n`);
          NODE
      # Ordinary deploys only create candidates on a miss. Explicit manual setup
      # is separate and refuses any matching app, including pending identities.
      # A release CVM carries
      # identity that lives outside this flow: DNS that names its app id, and
      # relying-party allowlists that name its measurements. Creating a new one
      # because the named CVM was deleted or renamed would deploy an instance
      # none of that points at, and report success. A release target is
      # provisioned explicitly once, then only ever updated by id on deploy.
      - name: Apply explicit Phala operation
        id: platform
        if: inputs.operation != 'deploy'
        timeout-minutes: 45
        env:
          PHALA_POLICY: ${{ needs.policy.outputs.phala }}
          PHALA_OPERATION: ${{ inputs.operation }}
          TARGET_ROLE: ${{ inputs.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          COMPOSE_FILE: ${{ steps.compose.outputs.file }}
        run: node "$RUNNER_TEMP/burnt-phala-tools/scripts/phala-setup-cli.mjs" create
      - name: Deploy CVM
        if: inputs.operation == 'deploy'
        env:
          PHALA_OPERATION: ${{ inputs.operation }}
          TARGET_ROLE: ${{ inputs.target }}
          CVM_NAME: ${{ fromJSON(needs.policy.outputs.phala).targets[inputs.target].cvmName }}
          COMPOSE_FILE: ${{ steps.compose.outputs.file }}
          WORKING_DIRECTORY: ${{ fromJSON(needs.policy.outputs.phala).workingDirectory }}
        run: |
          cd "$WORKING_DIRECTORY"
          PHALA_API_KEY="$(<"$RUNNER_TEMP/phala-api-key")"
          npx --yes phala@1.1.20 cvms list \
            --search "$CVM_NAME" \
            --page-size 100 \
            --json \
            --api-key "$PHALA_API_KEY" > "$RUNNER_TEMP/phala-cvms.json"
          # phala@1.1.20 emits normalized cvmName/appId, not raw name/id.
          existing_count="$(jq --arg name "$CVM_NAME" '[.items[] | select(.cvmName == $name)] | length' "$RUNNER_TEMP/phala-cvms.json")"
          if [ "$existing_count" -gt 1 ]; then
            echo "::error::More than one Phala CVM is named $CVM_NAME"
            exit 1
          elif [ "$existing_count" -eq 1 ]; then
            existing_app_id="$(jq -r --arg name "$CVM_NAME" '.items[] | select(.cvmName == $name) | .appId // empty' "$RUNNER_TEMP/phala-cvms.json")"
            if [[ ! "$existing_app_id" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Existing Phala CVM $CVM_NAME has no valid app id"
              exit 1
            fi
            # The CLI resolves app_<id> to the existing CVM; never use -n here.
            existing_id="app_$existing_app_id"
            target=(--cvm-id "$existing_id")
          elif [ "$TARGET_ROLE" = "candidate" ] && [ "${PHALA_OPERATION:-deploy}" = "deploy" ]; then
            target=(-n "$CVM_NAME")
          else
            echo "::error::No Phala CVM is named $CVM_NAME. The $TARGET_ROLE target is never created by this workflow; provision it by hand, or restore the name, then rerun"
            exit 1
          fi
          npx --yes phala@1.1.20 deploy \
            -c "$COMPOSE_FILE" \
            "${target[@]}" \
            --wait \
            --api-key "$PHALA_API_KEY" \
            -e "$RUNNER_TEMP/phala.env"
      - name: Resolve Phala public URL
        id: phala-url
        env:
          CVM_NAME: ${{ fromJSON(needs.policy.outputs.phala).targets[inputs.target].cvmName }}
          PUBLIC_URL: ${{ fromJSON(needs.policy.outputs.phala).targets[inputs.target].publicUrl }}
          PHALA_OPERATION: ${{ inputs.operation }}
          PHALA_POLICY: ${{ needs.policy.outputs.phala }}
          TARGET_ROLE: ${{ inputs.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$PHALA_OPERATION" != deploy ]; then
            node "$RUNNER_TEMP/burnt-phala-tools/scripts/phala-setup-cli.mjs" url
            exit 0
          fi
          # A target that terminates TLS inside the CVM (dstack-ingress, TLS
          # passthrough) is not reachable at the URL Phala reports: that one
          # expects the gateway to terminate TLS. Such a target names the URL it
          # actually serves in policy, and the health check goes there instead.
          if [ -n "$PUBLIC_URL" ]; then
            echo "deployment-url=${PUBLIC_URL%/}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PHALA_API_KEY="$(<"$RUNNER_TEMP/phala-api-key")"
          npx --yes phala@1.1.20 cvms get "$CVM_NAME" --json --api-key "$PHALA_API_KEY" > "$RUNNER_TEMP/phala-cvm.json"
          deployment_url="$(jq -r '
            [.endpoints[]?.app, .public_urls[]?.app, .publicUrls[]?.app, .public_url, .publicUrl]
            | map(select(type == "string" and startswith("https://")))
            | first // empty
          ' "$RUNNER_TEMP/phala-cvm.json")"
          if [ -z "$deployment_url" ]; then
            echo "::error::Phala CVM metadata did not contain a public HTTPS URL"
            exit 1
          fi
          echo "deployment-url=${deployment_url%/}" >> "$GITHUB_OUTPUT"
      - name: Verify health
        env:
          DEPLOYMENT_URL: ${{ steps.phala-url.outputs.deployment-url }}
          HEALTHCHECK_PATH: ${{ fromJSON(needs.policy.outputs.phala).healthcheckPath }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --show-error --silent "${DEPLOYMENT_URL}${HEALTHCHECK_PATH}" >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          echo "::error::Phala deployment health check failed after 30 attempts"
          exit 1
      - name: Mark explicit Phala operation healthy
        if: inputs.operation != 'deploy'
        env:
          PHALA_POLICY: ${{ needs.policy.outputs.phala }}
          PHALA_OPERATION: ${{ inputs.operation }}
          TARGET_ROLE: ${{ inputs.target }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node "$RUNNER_TEMP/burnt-phala-tools/scripts/phala-setup-cli.mjs" ready
      - name: Preserve public setup identity on success or failure
        if: ${{ always() && inputs.operation != 'deploy' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phala-${{ inputs.operation }}-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phala-setup.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary deployment credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/phala-api-key" "$RUNNER_TEMP/phala.env" "$RUNNER_TEMP/phala-target.json"
