name: Burnt npm PR

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@3b98d942aaa8aab198889980c570cf2408f4ed84

  pack:
    name: Package dry run
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ fromJSON(needs.quality.outputs.npm-policy).workingDirectory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Install
        run: ${{ fromJSON(needs.quality.outputs.quality-policy).commands.install }}
      - name: Build
        run: ${{ fromJSON(needs.quality.outputs.quality-policy).commands.build }}
      - name: Validate package contents
        run: npm pack --dry-run --json | tee "$RUNNER_TEMP/npm-pack.json"
      - name: Summarize package
        run: |
          {
            echo "### npm package preview"
            echo '```json'
            cat "$RUNNER_TEMP/npm-pack.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
