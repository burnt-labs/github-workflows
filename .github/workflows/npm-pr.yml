name: Burnt npm PR

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@d0a91f43145926ec7fb3253bf8ef6f01d5033a24

  pack:
    name: Package dry run
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ fromJSON(needs.quality.outputs.npm-policy).workingDirectory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Install
        run: ${{ fromJSON(needs.quality.outputs.quality-policy).commands.install }}
      - name: Build
        run: ${{ fromJSON(needs.quality.outputs.quality-policy).commands.build }}
      - name: Validate package contents
        run: npm pack --dry-run --json | tee "$RUNNER_TEMP/npm-pack.json"
      - name: Summarize package
        run: |
          {
            echo "### npm package preview"
            echo '```json'
            cat "$RUNNER_TEMP/npm-pack.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
