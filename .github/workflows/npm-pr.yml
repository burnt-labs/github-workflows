name: Burnt npm PR

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    uses: burnt-labs/github-workflows/.github/workflows/required-quality.yml@89bc4ceeb7c66617f5ef9dce230b4bdfe9b5cc41 # v1.3.0

  pack:
    name: Package dry run
    needs: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ fromJSON(needs.quality.outputs.npm-policy).workingDirectory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - name: Pin the npm CLI
        # See "npm install-time security" in AGENTS.md.
        run: |
          npm install --global npm@12
          if [ "$(npm --version | cut -d. -f1)" != "12" ]; then
            echo "::error::Expected npm 12 on PATH, found $(npm --version). Something is shadowing the pinned CLI."
            exit 1
          fi
      - name: Install
        run: ${{ fromJSON(needs.quality.outputs.quality-policy).commands.install }}
      - name: Build
        run: ${{ fromJSON(needs.quality.outputs.quality-policy).commands.build }}
      - name: Validate package contents
        run: npm pack --dry-run --json | tee "$RUNNER_TEMP/npm-pack.json"
      - name: Summarize package
        run: |
          {
            echo "### npm package preview"
            echo '```json'
            cat "$RUNNER_TEMP/npm-pack.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
