name: Burnt Required Quality

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      quality-policy-path:
        description: Repository-relative quality policy JSONC path
        required: false
        default: .github/quality-policy.jsonc
        type: string
      deployment-policy-path:
        description: Repository-relative Cloudflare deployment policy JSONC path
        required: false
        default: .github/deployment-policy.jsonc
        type: string
      npm-policy-path:
        description: Repository-relative npm policy JSONC path
        required: false
        default: .github/npm-policy.jsonc
        type: string
      phala-policy-path:
        description: Repository-relative Phala policy JSONC path
        required: false
        default: .github/phala-policy.jsonc
        type: string
      deployment-required:
        description: Fail when the selected deployment policy is absent
        required: false
        default: false
        type: boolean
      npm-required:
        description: Fail when the selected npm policy is absent
        required: false
        default: false
        type: boolean
      phala-required:
        description: Fail when the selected Phala policy is absent
        required: false
        default: false
        type: boolean
    outputs:
      quality-policy:
        description: Validated quality policy
        value: ${{ jobs.policy.outputs.quality }}
      deployment-policy:
        description: Validated deployment policy when present
        value: ${{ jobs.policy.outputs.deployment }}
      promotionMode:
        description: Manual or automatic when deployment policy is present
        value: ${{ jobs.policy.outputs['promotion-mode'] }}
      npm-policy:
        description: Validated npm policy when present
        value: ${{ jobs.policy.outputs.npm }}
      npmPromotionMode:
        description: Manual or automatic when npm policy is present
        value: ${{ jobs.policy.outputs['npm-promotion-mode'] }}
      phala-policy:
        description: Validated Phala policy when present
        value: ${{ jobs.policy.outputs.phala }}

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubicloud-standard-2
    outputs:
      quality: ${{ steps.policy.outputs.quality }}
      deployment: ${{ steps.policy.outputs.deployment }}
      promotion-mode: ${{ steps.policy.outputs['promotion-mode'] }}
      npm: ${{ steps.policy.outputs.npm }}
      npm-promotion-mode: ${{ steps.policy.outputs['npm-promotion-mode'] }}
      phala: ${{ steps.policy.outputs.phala }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout central policy tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnt-labs/github-workflows
          ref: ed309eaa57dfea000dfe6f4fbcb3c5c16773cd6e # v1.6.0
          path: .burnt-workflows
      - id: policy
        name: Validate policies
        env:
          QUALITY_POLICY_PATH: ${{ inputs.quality-policy-path }}
          DEPLOYMENT_POLICY_PATH: ${{ inputs.deployment-policy-path }}
          NPM_POLICY_PATH: ${{ inputs.npm-policy-path }}
          PHALA_POLICY_PATH: ${{ inputs.phala-policy-path }}
          DEPLOYMENT_REQUIRED: ${{ inputs.deployment-required }}
          NPM_REQUIRED: ${{ inputs.npm-required }}
          PHALA_REQUIRED: ${{ inputs.phala-required }}
        run: |
          args=()
          if [ "$DEPLOYMENT_REQUIRED" = "true" ]; then args+=(--deployment); fi
          if [ "$NPM_REQUIRED" = "true" ]; then args+=(--npm); fi
          if [ "$PHALA_REQUIRED" = "true" ]; then args+=(--phala); fi
          node .burnt-workflows/scripts/policy.bundle.mjs "${args[@]}"

  quality:
    name: Quality
    needs: policy
    runs-on: ubicloud-standard-4
    defaults:
      run:
        working-directory: ${{ fromJSON(needs.policy.outputs.quality).workingDirectory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        if: fromJSON(needs.policy.outputs.quality).toolchain == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Enable Corepack
        if: fromJSON(needs.policy.outputs.quality).toolchain == 'node'
        run: corepack enable
      - name: Pin the npm CLI
        # See "npm install-time security" in AGENTS.md.
        if: fromJSON(needs.policy.outputs.quality).toolchain == 'node'
        run: |
          npm install --global npm@12
          if [ "$(npm --version | cut -d. -f1)" != "12" ]; then
            echo "::error::Expected npm 12 on PATH, found $(npm --version). Something is shadowing the pinned CLI."
            exit 1
          fi
      - name: Setup Rust
        if: fromJSON(needs.policy.outputs.quality).toolchain == 'rust'
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # No toolchain named here on purpose: with the input empty the action
          # installs whatever the consumer's rust-toolchain.toml pins, which is
          # the file its own contributors already read.
          rust-src-dir: ${{ fromJSON(needs.policy.outputs.quality).workingDirectory }}
          components: clippy, rustfmt
          # Strictness belongs to the consumer's lint command, not to this job.
          # Left at its default the action exports CARGO_BUILD_WARNINGS=deny,
          # which turns every warning in the workspace into a platform-layer
          # decision nobody declared.
          build-warnings: ""
          cache: false
      - name: Report the Rust toolchain
        if: fromJSON(needs.policy.outputs.quality).toolchain == 'rust'
        run: |
          cargo --version
          rustc --version
      - name: Install
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.install }}
      - name: Lint
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.lint }}
      - name: Prettier
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.prettier }}
      - name: Type-check
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.typeCheck }}
      - name: Test
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.test }}
      - name: Coverage
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.coverage }}
      - name: Build
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.build }}
      - name: Validate
        if: fromJSON(needs.policy.outputs.quality).commands.validate != ''
        run: ${{ fromJSON(needs.policy.outputs.quality).commands.validate }}
